name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  laravel-tests:
    name: PHP Tests & Build (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_app_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci

      - name: Compile Frontend Assets (Vite)
        run: npm run build

      - name: Code Style Check (Laravel Pint)
        run: php vendor/bin/pint --test

      - name: Copy Testing Environment
        run: php -r "file_exists('.env.testing') || copy('.env.example', '.env.testing');"

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quiz_app_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force --env=testing

      - name: Execute Unit and Integration Tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: quiz_app_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: laravel-tests
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH into Azure VM and Update Code
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/quiz-app

            echo "==> Updating code from master..."
            git fetch origin master
            git reset --hard origin/master

            echo "==> Installing Composer dependencies..."
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

            echo "==> Installing NPM dependencies..."
            npm ci --no-audit

            echo "==> Building frontend assets..."
            npm run build

            echo "==> Running migrations & caching..."
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Reloading services..."
            sudo systemctl reload php8.3-fpm
            sudo systemctl reload nginx

            echo "==> Deployment finished successfully!"

